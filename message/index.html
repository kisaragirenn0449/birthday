<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>にゃるるへ</title>

    <style>
      body {
        font-family: var(--font-main);
        background-color: #abfcff;
      }

      h1 {
        position: relative;
        display: inline-block;
        font-size: 36px;
        color: #333;
      }

      h1::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0.1em;
        width: 100%;
        height: 0.5em;
        z-index: -1;
        border-radius: 4px;
      }

      .p {
        text-align: center;
      }

      /* ====== ギャラリー ====== */
      .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr); /* PCは3列 */
        gap: 20px;
        max-width: 1200px;
        margin: 20px auto;
        padding: 0 20px;
      }

      .gallery img {
        width: 100%;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .gallery img:hover {
        transform: scale(1.05);
      }

      .item {
        text-align: center;
        font-size: 20px;
      }

      /* ====== レスポンシブ ====== */
      @media (max-width: 900px) {
        .gallery {
          grid-template-columns: repeat(2, 1fr); /* タブレットは2列 */
        }
      }

      @media (max-width: 600px) {
        .gallery {
          grid-template-columns: 1fr; /* スマホは1列 */
        }

        .header {
          flex-direction: column;
          gap: 10px;
        }

        .header-right {
          flex-wrap: wrap;
          justify-content: center;
        }
      }

      /* ===== モーダル ===== */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        max-width: 90%;
        max-height: 90%;
        border-radius: 10px;
      }

      .close {
        position: absolute;
        top: 20px;
        right: 35px;
        font-size: 40px;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="gallery">
      <div class="item">
        <img src="/message/img/suiren.png" onclick="openModal(this)" />
        <div class="p">
          <p>suirenから</p>
        </div>
      </div>
      <div class="item">
        <img src="/message/img/touro.png" onclick="openModal(this)" />
        <div class="p">
          <p>灯炉ぼたんから</p>
        </div>
      </div>

      <div class="item">
        <img src="/message/img/hikage.png" onclick="openModal(this)" />
        <div class="p">
          <p>日景むぎから</p>
        </div>
      </div>

      <div class="item">
        <img src="/message/img/ayaseusagi.png" onclick="openModal(this)" />
        <div class="p">
          <p>あやせうさぎから</p>
        </div>
      </div>

      <div class="item">
        <img src="/message/img/banana.png" onclick="openModal(this)" />
        <div class="p">
          <p>バナナ・オレから</p>
        </div>
      </div>

      <div class="item">
        <img src="/message/img/komainu.png" onclick="openModal(this)" />
        <div class="p">
          <p>白犬コマから</p>
        </div>
      </div>

      <div class="item">
        <img src="/message/img/ruu.png" onclick="openModal(this)" />
        <div class="p">
          <p>るぅから</p>
        </div>
      </div>

      <div class="item">
        <img src="/message/img/tanatosu.png" onclick="openModal(this)" />
        <div class="p">
          <p>たなとすから</p>
        </div>
      </div>

      <div class="item">
        <img src="/message/img/taneo.png" onclick="openModal(this)" />
        <div class="p">
          <p>たねおから</p>
        </div>
      </div>

      <div class="item">
        <a href="./alicell/index.html" target="_blank">
          <img src="/message/img/alicell.png" />
        </a>
        <div class="p">
          <p>ありせるみみみから</p>
        </div>
      </div>

      <div class="item">
        <a href="./hiro/index.html" target="_blank">
          <img src="/message/img/hiro.png" />
        </a>
        <div class="p">
          <p>ひろから</p>
        </div>
      </div>
    </div>

    <!-- モーダル -->
    <div id="imageModal" class="modal" onclick="closeModal()">
      <span class="close" onclick="closeModal()">&times;</span>
      <img class="modal-content" id="modalImg" />
    </div>

    <script>
      function openModal(img) {
        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImg");
        modal.style.display = "flex";
        modalImg.src = img.src;
      }

      function closeModal() {
        document.getElementById("imageModal").style.display = "none";
      }
    </script>
  </body>
</html>
